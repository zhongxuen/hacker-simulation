        interfaces:
          - { ip: 172.16.30.20, subnet: 172.16.30.0/24 }
        os: { family: linux, name: Linux, version: "6.8" }
        users:
          # recruit is in the sudo group, which is what makes the bonus objective reachable.
          # Every passwordHash here is a made-up yescrypt-shaped string, not a real hash.
          - name: recruit
            uid: 1000
            groups: [sudo]
            passwordHash: "$y$j9T$VxVRyX1eGuIflMYcs6T583$7l3Wljpyq7/XTgtw6875TZ3v7xuTK87VBnD0np4p9Im"
          # The shared volunteer account: the whole problem in one line.
          - name: boxoffice
            uid: 1001
            passwordHash: "$y$j9T$ida93t4H/rUSVc6ZN2dlL8$S/a8yefNzyRWFwJgrWqW7bImWHEtxfXWUZfvHlRuCM8"
          - name: wren
            uid: 1002
            passwordHash: "$y$j9T$omjp46ycDXmZ2VMtKQbkRt$YTwTJGpuXU.G.FxfEwEUyli28VsRYDBuj8ViuQ.g1kL"
        fs:
