objectives:
  - id: open-the-practice-file
    description: "Read the committee's practice copy of the sign-in list, in `~/practice`"
    why: Before you can say how the theatre keeps its passwords, you have to look at what it keeps.
    success: >-
      Eleven volunteers, eleven rows, and not a password in sight. What the theatre stores is a
      scramble of each one.
    check:
      kind: event
      event: file.read
      match: { path: /home/recruit/practice/volunteers-export.txt }
  - id: name-the-storage
    description: "Let `hashid` name the recipe that made the scrambles in the practice file"
    why: The recipe is what tells you how much protection the theatre's passwords actually have.
    success: "Ten of the eleven are MD5: fast, and long since broken for security use."
    check:
      kind: event
      event: hash.identified
      match: { format: md5 }
  - id: find-the-better-one
    description: Type the name of the format, or of the volunteer, whose row was stored the safe way
    why: Knowing what good looks like is how you recognise it, and how you recommend it.
    success: "That's the one: wren's row is bcrypt, slow and salted, built for exactly this job."
    check:
      kind: answer
      accept:
        - bcrypt
        - wren
        - wren's
        - wren's row
        - the bcrypt one
        - the bcrypt row
        - $2b$
        - $2b
        - the last one
        - the last row
  - id: one-password-many-doors
    description: Choose why one break-in opened the whole box office
    why: A finding has to name the real cause, or the fix gets aimed at the wrong thing.
    success: >-
      Eleven people, one account, one password. The computer never knew which of them was at the
      keyboard, and neither does anyone reading the record afterwards.
    check:
      kind: answer
      accept: ["Everyone signed in as the same account, so one password was all eleven passwords."]
      choices:
        - text: "Everyone signed in as the same account, so one password was all eleven passwords."
        - text: The password was too short.
          reply:
            speaker: mentor-noor
            text: >-
              Length helps, and a longer shared password is still shared. Eleven people can't keep
              one secret between them, and the computer still can't tell which of them signed in.
        - text: Somebody guessed it from the theatre's website.
          reply:
            speaker: teammate-idris
            text: >-
              Idris Fenwick, I look after the defensive side. They didn't guess - the sign-in worked
              first time, on the first try. That's a password somebody already had.
  - id: kits-question
    description: Answer Kit - what does the team do about whoever left the note?
    why: >-
      Permission is what separates this job from the other one, and it holds even when the other
      side started it.
    success: >-
      Write it up, hand it over, let the theatre decide. That's the answer every time, and it's the
      reason the team gets invited back.
    check:
      kind: answer
      accept:
        ["Write it up for the theatre, and let the theatre decide whether to go to the police."]
      choices:
        - text: "Write it up for the theatre, and let the theatre decide whether to go to the police."
        - text: Find the address they came from and get into their computer.
          reply:
            speaker: teammate-theo
            text: >-
              Same crime, Kit. The law doesn't have a "they started it" clause. And the address on a
              note like this is nearly always a stranger's home router that somebody's borrowed -
              you'd be breaking into a neighbour's house because someone else parked outside it.
        - text: Put the note online and ask who recognises it.
          reply:
            speaker: teammate-idris
            text: >-
              Then eleven volunteers find out from the internet, and so does everybody who fancies a
              go at the theatre next. It's the theatre's information. They tell people in their own
              time, in their own words.
  - id: recommend-fix
    description: Choose what to recommend to the theatre's committee
    why: A finding the client can't act on is a finding that changes nothing.
    success: >-
      One sign-in each, stored slowly and salted, and a second step. Roz can read that out on
      Thursday, and the committee can carry it out.
    check:
      kind: answer
      accept:
        [
          "Give every volunteer their own sign-in, store the passwords with a slow, salted method, and add a second step at sign-in.",
        ]
      choices:
        - text: "Give every volunteer their own sign-in, store the passwords with a slow, salted method, and add a second step at sign-in."
        - text: Pick a longer shared password and tell everyone the new one.
          reply:
            speaker: mentor-noor
            text: >-
              That's one secret in eleven heads again, and the computer still can't tell them apart.
              What would let it?
        - text: Scramble the passwords twice with the same fast method.
          reply:
            speaker: mentor-noor
            text: >-
              Two fast rounds are still fast. The point of the slow method isn't secrecy, it's time -
              it makes guessing cost something.
  - id: the-understudy
    name: The Understudy
    description: "Look at how `boxoffice-01` stores its own Linux passwords, and let `hashid` name that"
    why: The method you're about to recommend is already running on the machine you're sitting at.
    success: >-
      yescrypt: slow, salted, and switched on by default. The good answer was waiting in the wings
      the whole time.
    optional: true
    check:
      kind: event
      event: hash.identified
      match: { format: yescrypt }
  - id: break-a-leg
    name: Break a Leg
    description: Find where the box office password was actually written down
    why: A password eleven people share doesn't stay in eleven heads. It gets written somewhere handy.
    success: >-
      Page four of the prompt book, between two lighting cues: the sign-in, the wifi password, and
      where the spare key lives.
    hidden: true
    check:
      kind: event
      event: file.read
      match: { path: /home/boxoffice/promptbook/act1-notes.txt }
hints:
  open-the-practice-file:
    - The committee left a practice copy of their sign-in list in a folder of its own inside your home folder.
    - "`ls practice` shows what's in that folder, and `cat` prints a file to the screen."
    - "Type `cat ~/practice/volunteers-export.txt`."
  name-the-storage:
    - Those long strings aren't passwords. One of the tools on this machine reads the shape of a string like that and names the recipe that made it.
    - "`hashid` names hash formats. Given `--file`, it reads a whole file and takes each line in turn."
    - "Type `hashid --file ~/practice/volunteers-export.txt`."
  find-the-better-one:
    - Ten of the eleven rows look alike. One doesn't.
    - Read what the tool said under each row. One of them is described as slow and salted, which is what you want for storing passwords.
    - "It's the row belonging to `wren`, and the format is called bcrypt. Type either one."
  one-password-many-doors:
    - Eleven volunteers, eleven rows in the list - but how many accounts do they use between them?
    - Think about what the computer sees when a volunteer signs in. Can it tell which of the eleven is at the keyboard?
    - Pick the answer about everyone signing in as the same account.
  kits-question:
    - Kit wants to even the score. Think about who else could get caught up in that, and what the team has permission to touch.
    - Nobody has given Candlewright permission to go near the machine that note came from, and a machine like that usually belongs to somebody who has no idea it's being used.
    - Pick the answer that writes it up for the theatre and leaves the police to the theatre.
  recommend-fix:
    - "Two problems, not one: the passwords are kept badly, and eleven people share a sign-in."
    - A good fix gives the computer a way to tell the volunteers apart, makes each guess cost time, and asks for something as well as the password.
    - "Pick the answer with three parts: a sign-in each, slow salted storage, and a second step."
  the-understudy:
    - This computer keeps its own Linux passwords somewhere, in a file only the admin account may read.
    - "They live in `/etc/shadow`. `sudo` runs a single command as the admin account, and `hashid` reads a whole file with `--file`."
    - "Type `sudo hashid --file /etc/shadow`."
debrief:
  summary: >-
    You read the theatre's practice list, worked out that ten of the eleven passwords were stored
    with a fast, broken method, found the one that was stored properly, and wrote the committee a
    fix they can carry out.
  whatYouLearned:
    - A hash is one-way, so a system can check a password without keeping it.
    - Fast scrambling is the last thing you want for passwords, because guessing is fast too.
    - A salt stops two identical passwords from looking identical, and a slow recipe makes each guess cost time.
    - "A shared sign-in means nobody's sign-in: the computer can't tell eleven people apart."
  ethicsNote: >-
    The theatre exported a practice copy of its list for this test, and the file says so in its own
    first line. `hashid` names a format and does nothing else - nothing here turns a hash back into
    a password, and the mission never asks for one. The online ticketing system stayed out of scope
    the whole way through, because the theatre can't give permission for another company's
    computers. And when Kit wanted to go after whoever left the note, the answer was the one the law
    gives: getting into their machine would be the same crime, whoever started it.
  defensiveTakeaway: >-
    One account per person, passwords stored with a slow salted method (bcrypt, scrypt or Argon2),
    and a second step at sign-in. And when a password does escape, change it and look for what else
    was left behind - which is the next episode.
  nextTease: "Larkmere Public Library has been shut all week for new carpets. Its lending desk computer has been signing in at two in the morning anyway."
  furtherReading: [crypto-password-storage, auth-passwords-and-mfa, ethics-unauthorized-testing]
