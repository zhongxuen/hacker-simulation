objectives:
  - id: list-the-logs
    description: "See which diaries this computer keeps, with `logview`"
    why: You can't read a log until you know which ones there are and which you're allowed to open.
    success: "Three logs: who signed in, what the catalogue software did, and a copy of the wifi box's diary."
    check:
      kind: commandRun
      pattern: "^logview\\s*$"
  - id: find-the-nights
    description: "Open the sign-in log, `/var/log/auth.log`, and find the four night-time sign-ins"
    why: The sign-in log is where a computer writes down who came in, and when.
    success: Four sign-ins, all a few minutes past two in the morning, in a week the building was locked.
    check:
      kind: event
      event: log.queried
      match: { path: /var/log/auth.log }
  - id: name-the-account
    description: Type the name of the account that signed in on those four nights
    why: An account name is the thread you pull. Everything that account did can be found from it.
    success: "`stockcheck`. Near enough to the library's own stock-take job that nobody looked twice."
    check:
      kind: answer
      accept:
        - stockcheck
        - "`stockcheck`"
        - the stockcheck account
        - stockcheck account
        - account stockcheck
        - user stockcheck
  - id: find-its-birthday
    description: "Search the sign-in log for every line mentioning `stockcheck`, and find where the account came from"
    why: An account has to be made by somebody. The line that made it says when, and who was signed in at the time.
    success: >-
      Made on Saturday 8 August at 21:46, by somebody signed in as `desk` - thirty-one days before
      the first night visit.
    check:
      kind: any
      of:
        - { kind: commandRun, pattern: "^logview\\b.*\\bstockcheck\\b" }
        - { kind: commandRun, pattern: "^grep\\b.*\\bstockcheck\\b" }
  - id: two-visitors
    description: Choose what the two patterns mean
    why: >-
      A timeline is worth reading twice: once for what happened, and once for what its shape says
      about who did it.
    success: Two habits, two people. The chapter's whole story is in that gap of thirty-one days.
    check:
      kind: answer
      accept:
        - "Two different people. One found the way in and left an account behind; the other used it weeks later."
      choices:
        - text: "Two different people. One found the way in and left an account behind; the other used it weeks later."
        - text: One person who got better at it.
          reply:
            speaker: teammate-idris
            text: >-
              That was my first thought too. Then look at it: the first visit spent six minutes
              looking around, the later ones went straight to the same three steps in the same order, and
              they came from three addresses in four nights. People don't move house three times
              in a week.
        - text: The library's own stock-take job running at an odd hour.
          reply:
            speaker: teammate-idris
            text: >-
              The stock-take job signs in as `stock`, at six in the morning, and it's in the log
              every morning of the quiet week too. It was doing its job while this was going on.
  - id: write-the-report
    description: Choose the first thing the library does, for the top of its incident report
    why: A report that ends in a finding is a story. A report that ends in an action is a fix.
    success: Switch the account off, then go looking for the others. That's the line Halima reads out on Thursday.
    check:
      kind: answer
      accept:
        - "Switch off the `stockcheck` account, then check every computer in the library for other accounts nobody remembers making."
      choices:
        - text: "Switch off the `stockcheck` account, then check every computer in the library for other accounts nobody remembers making."
        - text: Change the lending desk password.
          reply:
            speaker: mentor-noor
            text: >-
              Worth doing, and on its own it wouldn't have stopped any of this. The four night
              visits never used a password you can change. They used an account that was left
              behind.
        - text: Look up the three addresses and see what's running on them.
          reply:
            speaker: teammate-theo
            text: >-
              Those are somebody else's computers, and nobody there signed anything. It's the same
              crime whichever direction it points. The addresses go in the report, and the report is
              Halima's to take to the police if she wants to.
  - id: clock-watcher
    name: Clock Watcher
    description: "Work out how many minutes fast the wifi box's clock is running, and type the number"
    why: Two logs whose clocks disagree will build you a timeline of something that never happened.
    success: >-
      43 minutes fast. Every time in `wifi.log` needs 43 minutes taken off it before it goes
      anywhere near your timeline.
    optional: true
    check:
      kind: answer
      accept:
        - "43"
        - 43 minutes
        - 43 mins
        - 43 min
        - 43m
        - "+43"
        - 43 minutes fast
        - 43 minutes ahead
        - forty-three
        - forty-three minutes
  - id: left-on-the-counter
    name: Left Behind
    description: "Find what the night visitor left behind in `/tmp`"
    why: "`/tmp` is the folder everybody leaves things in, and the folder nobody thinks to look in."
    success: The export from night three, still sitting there four weeks later, with the time it was written on it.
    hidden: true
    check:
      kind: event
      event: file.read
      match: { path: /tmp/catalogue-export-0910.csv }
hints:
  list-the-logs:
    - Everything this mission needs is already written down on this computer. Find out what it keeps a diary of.
    - >-
      Linux keeps its logs in a folder called `/var/log`. One of the simulated tools lists them for
      you and says which ones you're allowed to open.
    - Type `logview` on its own and press Enter.
  find-the-nights:
    - "Sign-ins are the first thing to look at: who came in, and when."
    - >-
      `logview /var/log/auth.log` opens the sign-in log. It's long, so filter it: `--grep` keeps
      only the lines containing some text.
    - >-
      Type `logview /var/log/auth.log --grep Accepted`, then look for the times that start `02:`.
  name-the-account:
    - The four sign-ins in the small hours all name the same account. Read one of those lines slowly.
    - In a sign-in log, the account name is the word straight after `password for`.
    - It's the library's stock-take job's name with `check` on the end. Type it into the box.
  find-its-birthday:
    - That account didn't always exist. Somebody made it, and the computer wrote that line down too.
    - >-
      Filter the whole sign-in log for the account's name and you'll see every line it appears in,
      oldest at the top.
    - Type `logview /var/log/auth.log --grep stockcheck` and read the first line.
  two-visitors:
    - Put the first visit and the four nights side by side. What's different about the way they moved?
    - >-
      One visit spent six minutes opening pages and looking around. The four later ones did the same
      three things each time and left, from three different addresses in four nights.
    - Somebody who already knows the way doesn't look around. Pick the answer that says two people.
  write-the-report:
    - Ask what would still be true tomorrow night if the library did nothing today.
    - >-
      The four night visits never used the shared staff password, so changing it leaves the way in
      open. The account they did use is still on this computer.
    - Pick the answer that switches `stockcheck` off and then goes looking for others like it.
  clock-watcher:
    - >-
      One event is written down in two different logs. Find it, and the two times won't agree.
    - >-
      Your own sign-in this morning is in the sign-in log, and the wifi box wrote down the same
      moment. The seconds match; the minutes don't.
    - >-
      Run `logview /var/log/auth.log --grep recruit` and `logview /var/log/wifi.log --grep recruit`,
      take one time away from the other, and type the number of minutes.
debrief:
  summary: >-
    You read four nights of a library's logs, found the account that signed in, tracked it back to
    the evening somebody created it, worked out that two different people were involved, and gave
    Larkmere the first incident report it has ever had.
  whatYouLearned:
    - "A log is a record of what a computer did, and `/var/log` is where Linux keeps them."
    - "Filtering is what makes a long log usable: `--grep` keeps only the lines you asked for."
    - A timeline turns a pile of lines into a story, and two different habits mean two different people.
    - "An incident report is four plain answers, written down while it's fresh."
  ethicsNote: >-
    Halima Voss asked, and her letter named the computers and the logs. The borrowing records stayed
    shut the whole time, because what somebody reads is nobody's business but theirs, and the answer
    never needed them. The addresses in the log belong to other people's computers: they go in the
    report, and nowhere else. Reading them back would be the same crime pointed the other way, and
    the person at the other end is usually somebody whose computer is being borrowed without their
    knowing.
  defensiveTakeaway: >-
    After any break-in, list the accounts on every machine and switch off the ones nobody remembers
    making. Keep the clocks in step, so two logs can be read side by side. And write the incident
    down while it's fresh: four plain lines beat a perfect memory, and they're what lets somebody
    else join the dots later.
  nextTease: "The theatre's timeline and the library's have the same account name in them. So does a third set of logs nobody has asked us to read."
  furtherReading: [forensics-timelines, blue-incident-response, ethics-responsible-disclosure]
