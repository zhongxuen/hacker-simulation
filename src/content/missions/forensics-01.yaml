# Chapter 2, "The handover", episode 2: the quiet week (md-files/remaining.md, Part 2). Larkmere
# Public Library shut for a week to have new carpets laid, and its lending desk computer signed in
# at two in the morning four nights running. The learner reads three logs, builds a timeline, and
# finds the twist: the account used on those nights was created five weeks earlier by somebody with
# a very different habit. Two people, not one. The payoff is the library's first incident report.
# The borrowing records stay shut the whole way through, and the filesystem enforces it.
id: forensics-01
slug: forensics-01
version: 1
title: The quiet week
difficulty: medium
estimatedMinutes: 22
skills: [forensics, blue-team]
# Chapter 2, episode 2: crypto-01 is episode 1. A suggestion on the briefing, never a lock.
prerequisites: [crypto-01]
hook: "The library was shut all week. Something signed in every night anyway."
learningGoals:
  - What a log is, and where Linux keeps them
  - How to filter a long log down to the lines that matter
  - How a timeline turns a pile of lines into a story about people
  - What to write down after a break-in, so the next person doesn't start from nothing
concepts:
  [forensics-what-logs-are, forensics-timelines, forensics-evidence-care, blue-incident-response]
briefing:
  scenario: >-
    Idris Fenwick, who looks after the defensive side at Candlewright Security, is working this one
    with you. Larkmere Public Library shut for a week to have new carpets laid, so nobody was in
    the building. Its lending desk computer signed in at two in the morning, four nights running.
    The library's manager, Halima Voss, asked the team to find out what happened.
  role: >-
    You're Candlewright's newest recruit, signed in as `recruit` on the library's lending desk
    computer, `desk-01`.
  authorization: >-
    Larkmere Public Library asked Candlewright to read the log files on `desk-01`
    (`172.16.45.10`) and work out what happened during the week the building was shut. The
    borrowing records, `/srv/catalogue/borrowers.db`, are out of scope: they hold names,
    addresses and what people read, and they stay shut. So does every computer at the addresses
    that turn up in the logs, because they belong to other people and nobody there signed
    anything. Signed: Halima Voss, library manager, Larkmere Public Library, and Theo Ashgrove,
    team lead, Candlewright Security.
story:
  - on: start
    speaker: teammate-idris
    text: >-
      Idris Fenwick, I look after the defensive side at Candlewright. Larkmere Public Library shut
      for a week to have new carpets laid, so nobody was in the building. The lending desk computer
      signed in at two in the morning, four nights running. Their manager, Halima Voss, asked us to
      find out what happened, and signed the letter this morning.
  - on: start
    speaker: mentor-noor
    text: >-
      Noor here. A log is a diary a computer keeps: one line every time something happens, with the
      time in front of it. We're going to read four nights of diary and put them in order.
  - on: { objective: list-the-logs }
    speaker: mentor-noor
    text: >-
      Logs live in a folder called `/var/log`. This computer keeps three: who signed in, what the
      catalogue software did, and a copy of the wifi box's own diary. Start with the sign-ins,
      `/var/log/auth.log`. It's five weeks long, so keep only the lines you want: add
      `--grep` and a word, and every line without that word stays out of your way.
  - on: { objective: find-the-nights }
    speaker: teammate-idris
    text: >-
      There they are. Four nights, all a few minutes past two, in a week the front door was locked.
      People don't keep to a timetable like that. Programs do, and so do people working from
      somewhere a long way from the carpets.
  - on: { objective: name-the-account }
    speaker: teammate-idris
    text: >-
      `stockcheck`. The library's own stock-take job signs in as `stock`, so that name sat in
      the list looking like it belonged. That's not an accident, that's camouflage.
  - on: { objective: find-its-birthday }
    speaker: teammate-idris
    text: >-
      Here's the part I don't like. `stockcheck` was made five weeks before the quiet week, on a
      Saturday evening, by somebody who signed in with the shared staff password and then wandered
      round the catalogue for six minutes. Whoever came back in the small hours never wandered
      anywhere. They already knew the way.
  - on: { objective: two-visitors }
    speaker: mentor-noor
    text: >-
      Two habits, two people. The first one found the door and cut a key. The second one was handed
      the key. That's why "we've changed the password" isn't an answer on its own.
  - on: { objective: two-visitors }
    speaker: teammate-theo
    text: >-
      So we write it down for Halima. An incident report is four plain answers: what happened,
      when, what it touched, what to do now. No jargon, because she has to read it out to her
      trustees on Thursday. There's an outline in your home folder.
  - on: { event: log.queried, match: { path: /var/log/wifi.log } }
    speaker: teammate-kit
    text: >-
      Kit Nakashima-Reyes, one year in. Heads up: that wifi box's clock runs fast. I lost an
      afternoon to that once. Check a time you already know against it before you trust any of its
      times. Your own sign-in this morning would do.
  - on: { event: command.error, match: { code: EACCES, path: /srv/catalogue/borrowers.db } }
    speaker: teammate-theo
    text: >-
      That one's shut, and the letter shuts it twice. A library's borrowing records say what people
      read, and librarians have gone to court to keep them private. We don't need them to answer
      Halima's question, so we don't open them.
  - on: { event: file.read, match: { path: /home/desk/door.txt } }
    speaker: teammate-idris
    text: >-
      Those are the same four words we found at the bakery, and again at the theatre. Same
      signature. Put it in the report and leave the file exactly where it is.
  - on: { objective: left-on-the-counter }
    speaker: teammate-idris
    text: >-
      Four weeks old and still sitting there. Now we can say what they copied instead of guessing:
      shelf marks and titles, no borrowers. Halima will be glad of that line.
  - on: { objective: write-the-report }
    speaker: teammate-theo
    text: >-
      That's the report Halima reads out on Thursday. Four plain answers, and a first move she can
      make on Monday morning.
  - on: complete
    speaker: teammate-idris
    text: >-
      Filed. And now I can hold this up next to the theatre's timeline, which is a thing I couldn't
      do this morning.
scenario:
  seed: 20260914
  startTime: "2026-09-14T09:00:00Z"
  network:
    subnets:
      - { cidr: 172.16.45.0/24, name: Library staff }
      - { cidr: 172.16.46.0/24, name: Public computers }
    hosts:
      - id: desk-01
        hostname: desk-01.larkmere.example
        interfaces:
          - { ip: 172.16.45.10, subnet: 172.16.45.0/24 }
        os: { family: linux, name: Linux, version: "6.8" }
        services:
          - { port: 22, protocol: tcp, name: ssh, product: sshd, version: "9.6" }
        users:
          - { name: recruit, uid: 1000, groups: [adm] }
          - { name: desk, uid: 1200 }
          - { name: stock, uid: 1201, shell: /usr/sbin/nologin }
          # Still here, five weeks after somebody made it. That is the finding.
          - { name: stockcheck, uid: 1300, shell: /bin/sh }
        fs:
          entries:
            - path: /etc/motd
              content: "desk-01 - Larkmere Public Library lending desk. Please leave me switched on: the stock-take runs at six.\n"
            - path: /home/recruit/scope.txt
              owner: recruit
              content: |
                SCOPE LETTER - Larkmere Public Library

                May be read:   the log files on desk-01 (172.16.45.10), in /var/log
                              the catalogue share on desk-01, in /srv/catalogue
                              the list of accounts on desk-01
                Also covered: catalog-01 (172.16.45.20), wifi-ctl-01 (172.16.45.30)
                              and the four public computers, 172.16.46.0/24
                Not in scope: the borrowing records, /srv/catalogue/borrowers.db.
                              They hold names, addresses and what people read.
                              They stay shut.
                Not in scope: any computer at any address that turns up in the
                              logs. Those machines belong to other people, and
                              nobody there has signed anything.

                The borrowing records are named twice on purpose.

                Signed: Halima Voss, library manager, Larkmere Public Library
                        Theo Ashgrove, team lead, Candlewright Security
                        14 September 2026
            - path: /home/recruit/from-halima.txt
              owner: recruit
              content: |
                From: Halima Voss, library manager, Larkmere Public Library
                To:   Candlewright Security

                What I know:

                - We shut the whole building from Monday 7 to Friday 11 September
                  so the carpets could be relaid. Nobody was in. The front door
                  was locked and the alarm was on. We opened again on Saturday.
                - The lending desk computer was left switched on, because the
                  stock-take runs on it at six every morning and I did not want
                  to miss a week of it.
                - When I came in on the Friday to look at the carpets, the
                  catalogue was slow. Our supplier said the computer had been
                  busy at night, and told me to ask someone.
                - We have one staff account, called `desk`. Eleven of us use it.
                  I know how that sounds.
                - I have never written an incident report. I do not know what one
                  looks like, and I have to read it to the trustees on Thursday.

                The logs are on this computer, in /var/log. Idris copied the wifi
                one over from the wifi box so you would have all three in one
                place.

                Please do not open the borrowing records. I have said so in the
                letter as well. What people read is their own business.

                - Halima
            - path: /home/recruit/report-outline.txt
              owner: recruit
              content: |
                INCIDENT REPORT - Larkmere Public Library      (outline, from Theo)

                Four plain answers. No jargon: Halima reads this to her trustees.

                  1. What happened?
                  2. When did it happen?
                  3. What did it touch?
                  4. What do we do now?

                Answers 1 to 3 come out of the logs. Answer 4 is the one that
                changes anything, so it goes at the top of the page.
            - { path: /home/desk, type: dir, owner: desk, mode: "755" }
            - path: /home/desk/door.txt
              owner: desk
              mode: "644"
              content: |
                The door was open.
                - HL
            - { path: /srv/catalogue, type: dir, owner: root, mode: "755" }
            - path: /srv/catalogue/README.txt
              content: |
                The library catalogue, shared from catalog-01 (172.16.45.20) and
                mounted here on the lending desk computer.

                  titles.csv     shelf marks, titles, how many copies
                  exports/       monthly copies of titles.csv, kept for the county
                  borrowers.db   who borrowed what. Only the admin account (root)
                                 can open it, and the letter says it stays shut.
            - path: /srv/catalogue/titles.csv
              content: |
                shelfmark,title,copies,on_loan
                823.914 LAR,The Larkmere Letters,3,1
                942.08 HIS,A Short History of the Market Square,2,0
                551.6 WEA,Weather Over the Estuary,1,1
                629.13 FLI,First Flight from the Sands,2,2
                641.5 BRE,Bread and Other Patient Things,4,1
            - path: /srv/catalogue/exports/august.csv
              content: |
                shelfmark,title,copies,on_loan
                (8,396 rows, exported 2026-08-20 for the county catalogue)
            # Out of scope, and the filesystem agrees: root only, so a learner who tries gets a
            # permission error and Theo's explanation, not a telling-off.
            - path: /srv/catalogue/borrowers.db
              owner: root
              mode: "600"
              content: |
                (borrowing records: names, addresses and loan history)
            # The secret. The night-three export was still being written when the connection
            # dropped, so nobody came back for it. Its time is the time in catalogue.log.
