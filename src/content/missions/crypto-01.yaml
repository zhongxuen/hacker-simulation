# Chapter 2, "The handover", episode 1 (md-files/remaining.md, Part 2). The theatre's box office was
# opened with a password eleven volunteers shared, and there's a note signed "- HL" on the desktop.
# The learner reads the committee's practice copy of its sign-in list, lets `hashid` name how the
# passwords are stored, finds the one row that was stored properly, answers Kit's "let's go after
# them" with the chapter's spine, and leaves the theatre a fix it can carry out. Nothing here turns
# a hash back into a password, and the online ticketing company stays out of scope throughout.
id: crypto-01
slug: crypto-01
version: 1
title: Curtain call
difficulty: medium
estimatedMinutes: 20
skills: [crypto, blue-team]
prerequisites: [net-01]
hook: "Eleven volunteers shared one box office password. So did somebody else."
learningGoals:
  - What a hash is, and why keeping one isn't the same as keeping the password
  - Why a fast scrambling recipe is the last thing you want for passwords
  - What a salt does, and which recipes are built for storing passwords
  - Why a sign-in that eleven people share can't protect any of them
concepts: [crypto-hashing, crypto-password-storage, auth-passwords-and-mfa, ethics-scope]
briefing:
  scenario: >-
    Juniper Row Players are a community theatre run by volunteers, two streets from Tumbleloaf
    Bakery. Last week somebody opened their box office computer with a password that wasn't theirs
    and left a note on the desktop. Roz Kowalczyk, who owns the bakery and sits on the theatre's
    committee, asked Candlewright Security to look at how the theatre keeps its passwords.
  role: "You're Candlewright's newest recruit, signed in as `recruit` on the box office computer, `boxoffice-01`."
  authorization: >-
    Juniper Row Players asked Candlewright to examine `boxoffice-01` at `172.16.30.20`, the lighting
    desk's status page at `172.16.30.40`, and the practice copy of the volunteer sign-in list that
    the committee exported for this test. The online ticketing system is out of scope: it runs on
    another company's computers, and the theatre can't give permission for machines it doesn't own.
    Nothing in this test turns a stored password back into a password. Signed: Roz Kowalczyk,
    committee member, Juniper Row Players, and Theo Ashgrove, team lead, Candlewright Security.
story:
  - on: start
    speaker: teammate-theo
    text: >-
      Theo Ashgrove, I lead the team here at Candlewright. Juniper Row Players are a community
      theatre run by volunteers, and last week somebody opened their box office computer with a
      password that wasn't theirs. Their committee signed the letter this morning.
  - on: start
    speaker: mentor-noor
    text: >-
      Noor here, your mentor. We're not here to find out who opened it. We're here to look at how
      the theatre keeps its passwords, and leave them keeping them better.
  - on: { event: file.read, match: { path: /home/boxoffice/Desktop/door.txt } }
    speaker: teammate-theo
    text: >-
      That's the note Idris found. Nothing broken, nothing taken, and somebody wanted the theatre to
      know they'd been inside. That's the part I don't like.
  - on: { objective: open-the-practice-file }
    speaker: client-roz
    text: >-
      Roz Kowalczyk - I own the bakery on the corner and I'm on the theatre's committee. That list
      is a practice copy we made for you. Those aren't the passwords, are they? They don't look like
      words at all.
  - on: { objective: open-the-practice-file }
    speaker: mentor-noor
    text: >-
      They're not, Roz. A hash is what comes out when a computer puts a password through a one-way
      mixer. Same password in, same scramble out, every time - and no way back. That's how a system
      can check a password without keeping it.
  - on: { event: hash.identified, match: { format: md5 } }
    speaker: mentor-noor
    text: >-
      The shape tells you the recipe, and this recipe is fast. Fast is the problem: a mixer that
      runs a million times a second lets somebody try a million guesses a second.
  - on: { objective: find-the-better-one }
    speaker: client-roz
    text: "One of them looks nothing like the others. Is that a mistake?"
  - on: { objective: find-the-better-one }
    speaker: mentor-noor
    text: >-
      That one's deliberate. It's slow on purpose, and it has a pinch of random text mixed in - a
      salt - so two volunteers who picked the same password don't end up with the same scramble.
  - on: { objective: one-password-many-doors }
    speaker: teammate-kit
    text: >-
      Kit Nakashima-Reyes, analyst, one year in. Eleven people, one sign-in. So when one person's
      password goes for a walk, it isn't one person's password.
  - on: { objective: one-password-many-doors }
    speaker: teammate-kit
    text: >-
      And whoever left that note signed it. I could find the address they came from and have a look
      at their machine. They started it.
  - on: { objective: kits-question }
    speaker: teammate-theo
    text: >-
      The law doesn't have a "they started it" clause, Kit. Getting into their computer is the same
      crime as getting into this one. And the address on a note like that is usually a stranger's
      home router that somebody's borrowed - you'd be breaking into a neighbour's house because
      someone else parked outside it. We write up what we found. If the theatre wants the police,
      that's the theatre's call.
  - on: { objective: kits-question }
    speaker: teammate-kit
    text: "...Yeah. All right. I hate it, and you're right."
  # hashid reads a file without going through `cat`, so this hangs on the format it names rather
  # than on a file.read of /etc/shadow, which only `sudo cat` would send.
  - on: { event: hash.identified, match: { format: yescrypt } }
    speaker: mentor-noor
    text: >-
      Look at that - this computer's own accounts are stored the slow, salted way already. The thing
      you're about to recommend is running on the machine you're sitting at.
  - on: { event: web.probed, match: { hostId: lights-01 } }
    speaker: teammate-kit
    text: "The lighting desk has a web page. Act two, cue 31, house lights at 22:40. I love this job."
  - on: { objective: recommend-fix }
    speaker: client-roz
    text: >-
      So: everyone gets their own sign-in, and the computer asks for something else as well as the
      password. I can put that to the committee on Thursday. Will they follow it?
  - on: complete
    speaker: teammate-theo
    text: >-
      Eleven sign-ins instead of one, stored properly, with a second step. Put it in three sentences
      Roz can read out on Thursday, and we're done here.
scenario:
